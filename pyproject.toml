[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling>=1.27", # PEP 639 license expressions
]

[project]
name = "aa-wanderer-leaderboard"
description = "Monthly mapping contribution leaderboard for Wanderer"
readme = "README.md"
keywords = [
    "allianceauth",
    "leaderboard",
    "wanderer",
]
# Matches Alliance Auth, which this app is loaded into and imports from.
license = "GPL-2.0-only"
license-files = [
    "LICENSE",
]
authors = [
    { name = "Ryan R. Olds", email = "ryanrolds@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=4.0.0,<6",
    "requests>=2.28",
]

[project.urls]
Changelog = "https://github.com/ryanrolds/aa-wanderer-leaderboard/blob/main/CHANGELOG.md"
Homepage = "https://github.com/ryanrolds/aa-wanderer-leaderboard"
Issues = "https://github.com/ryanrolds/aa-wanderer-leaderboard/issues"
Source = "https://github.com/ryanrolds/aa-wanderer-leaderboard"

[tool.hatch.version]
path = "wanderer_leaderboard/__init__.py"

# The wheel is what gets installed, so it carries the app and nothing else.
[tool.hatch.build.targets.wheel]
packages = [
    "wanderer_leaderboard",
]
exclude = [
    "wanderer_leaderboard/tests",
]

# The sdist carries enough to run the suite from an unpacked tarball.
[tool.hatch.build.targets.sdist]
include = [
    "/wanderer_leaderboard",
    "/testauth",
    "/runtests.py",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
